[package]
name = "lumi-core"
version = "3.1.0"
description = "LumiCore local-first personal AI"
authors = ["LumiCore"]
edition = "2021"

[lib]
name = "lumi_core_lib"
crate-type = ["lib", "staticlib"]

[build-dependencies]
embed-resource = "3"
sha2 = "0.10"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.33"
dirs-next = "2"
arboard = "3"
enigo = "0.2"
encoding_rs = "0.8"
