name: Build macOS Installer

on:
  workflow_dispatch:
    inputs:
      include_local_voice:
        description: 'Bundle large offline voice resources'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - name: Download Node.js binary
        run: node scripts/download-node-binary.mjs

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build macOS installer
        env:
          LUMI_DESKTOP_WITH_LOCAL_VOICE: ${{ inputs.include_local_voice == 'true' && '1' || '0' }}
        run: npm run tauri:build

      - name: Verify macOS bundle permissions
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg_path"

          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet || true
            rmdir "$mount_dir" 2>/dev/null || true
          }
          trap cleanup EXIT

          hdiutil attach "$dmg_path" -mountpoint "$mount_dir" -nobrowse -readonly -quiet
          app_path="$(find "$mount_dir" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"

          plist_path="$app_path/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$plist_path"
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$plist_path"

          expected_version="$(node -p "require('./package.json').version")"
          actual_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist_path")"
          test "$actual_version" = "$expected_version"

      - name: Upload macOS installer
        uses: actions/upload-artifact@v7
        with:
          name: lumi-os-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error
