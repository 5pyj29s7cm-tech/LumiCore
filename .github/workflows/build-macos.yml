name: Build macOS Installer

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-macos.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'server/**'
      - 'shared/**'
      - 'src/**'
      - 'src-tauri/**'
  workflow_dispatch:
    inputs:
      include_local_voice:
        description: 'Bundle large offline voice resources'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      signing_mode:
        description: 'Use Developer ID signing/notarization secrets when available'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'require'
          - 'unsigned'

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - name: Verify TypeScript and behavior
        run: |
          npm run lint
          npm test -- --run

      - name: Download Node.js binary
        run: node scripts/download-node-binary.mjs

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Prepare desktop resources for Rust quality gates
        env:
          LUMI_DESKTOP_WITH_LOCAL_VOICE: ${{ inputs.include_local_voice == 'true' && '1' || '0' }}
        run: npm run build:desktop

      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Rust release check
        working-directory: src-tauri
        run: cargo check --release --locked

      - name: Prepare Apple signing and notarization
        shell: bash
        env:
          SIGNING_MODE: ${{ inputs.signing_mode || 'auto' }}
          APPLE_CERTIFICATE_SECRET: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER_SECRET: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_SECRET: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY_SECRET: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          has_certificate=false
          has_notarization=false
          if [[ -n "$APPLE_CERTIFICATE_SECRET" && -n "$APPLE_CERTIFICATE_PASSWORD_SECRET" ]]; then
            has_certificate=true
          fi
          if [[ "$SIGNING_MODE" != "unsigned" && -n "$APPLE_API_ISSUER_SECRET" && -n "$APPLE_API_KEY_SECRET" && -n "$APPLE_API_PRIVATE_KEY_SECRET" ]]; then
            has_notarization=true
            api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_SECRET}.p8"
            printf '%s' "$APPLE_API_PRIVATE_KEY_SECRET" > "$api_key_path"
            chmod 600 "$api_key_path"
            echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"
          elif [[ "$SIGNING_MODE" != "unsigned" && -n "$APPLE_ID_SECRET" && -n "$APPLE_PASSWORD_SECRET" && -n "$APPLE_TEAM_ID_SECRET" ]]; then
            has_notarization=true
          fi

          expected_signed=false
          expected_notarized=false
          if [[ "$SIGNING_MODE" != "unsigned" && "$has_certificate" == "true" ]]; then
            expected_signed=true
          fi
          if [[ "$expected_signed" == "true" && "$has_notarization" == "true" ]]; then
            expected_notarized=true
          fi
          if [[ "$SIGNING_MODE" == "require" && "$expected_notarized" != "true" ]]; then
            echo 'Signing mode requires APPLE_CERTIFICATE/APPLE_CERTIFICATE_PASSWORD and either App Store Connect API or Apple ID notarization secrets.' >&2
            exit 1
          fi
          if [[ "$SIGNING_MODE" == "auto" && "$expected_notarized" != "true" ]]; then
            echo '::warning::Apple distribution secrets are incomplete; producing an explicitly reported non-notarized diagnostic build.'
          fi
          echo "LUMI_EXPECT_SIGNED=$expected_signed" >> "$GITHUB_ENV"
          echo "LUMI_EXPECT_NOTARIZED=$expected_notarized" >> "$GITHUB_ENV"

      - name: Build macOS installer
        shell: bash
        env:
          LUMI_DESKTOP_WITH_LOCAL_VOICE: ${{ inputs.include_local_voice == 'true' && '1' || '0' }}
          APPLE_CERTIFICATE_SECRET: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER_SECRET: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_SECRET: ${{ secrets.APPLE_API_KEY }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ "$LUMI_EXPECT_SIGNED" == "true" ]]; then
            export APPLE_CERTIFICATE="$APPLE_CERTIFICATE_SECRET"
            export APPLE_CERTIFICATE_PASSWORD="$APPLE_CERTIFICATE_PASSWORD_SECRET"
            if [[ -n "$APPLE_SIGNING_IDENTITY_SECRET" ]]; then
              export APPLE_SIGNING_IDENTITY="$APPLE_SIGNING_IDENTITY_SECRET"
            fi
          else
            # Apple Silicon requires a signature even for diagnostic builds.
            export APPLE_SIGNING_IDENTITY='-'
          fi
          if [[ "$LUMI_EXPECT_NOTARIZED" == "true" ]]; then
            if [[ -n "$APPLE_API_ISSUER_SECRET" && -n "$APPLE_API_KEY_SECRET" ]]; then
              export APPLE_API_ISSUER="$APPLE_API_ISSUER_SECRET"
              export APPLE_API_KEY="$APPLE_API_KEY_SECRET"
            else
              export APPLE_ID="$APPLE_ID_SECRET"
              export APPLE_PASSWORD="$APPLE_PASSWORD_SECRET"
              export APPLE_TEAM_ID="$APPLE_TEAM_ID_SECRET"
            fi
          fi
          npm run tauri:build

      - name: Verify macOS bundle permissions
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg_path"

          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet || true
            rmdir "$mount_dir" 2>/dev/null || true
          }
          trap cleanup EXIT

          hdiutil attach "$dmg_path" -mountpoint "$mount_dir" -nobrowse -readonly -quiet
          app_path="$(find "$mount_dir" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"

          plist_path="$app_path/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$plist_path"
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$plist_path"
          /usr/libexec/PlistBuddy -c 'Print :NSAppleEventsUsageDescription' "$plist_path"
          /usr/libexec/PlistBuddy -c 'Print :NSDesktopFolderUsageDescription' "$plist_path"
          /usr/libexec/PlistBuddy -c 'Print :NSDocumentsFolderUsageDescription' "$plist_path"
          /usr/libexec/PlistBuddy -c 'Print :NSDownloadsFolderUsageDescription' "$plist_path"

          expected_version="$(node -p "require('./package.json').version")"
          actual_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist_path")"
          test "$actual_version" = "$expected_version"

          app_binary="$(find "$app_path/Contents/MacOS" -maxdepth 1 -type f -print -quit)"
          node_binary="$app_path/Contents/Resources/_up_/desktop-resources/dist-server/node"
          sharp_dir="$app_path/Contents/Resources/_up_/desktop-resources/dist-server/node_modules/@img/sharp-darwin-arm64"
          test -x "$app_binary"
          test -x "$node_binary"
          file "$app_binary" | grep -q 'arm64'
          file "$node_binary" | grep -q 'arm64'
          test -d "$sharp_dir"
          test ! -d "$app_path/Contents/Resources/_up_/desktop-resources/dist-server/node_modules/@img/sharp-win32-x64"

          {
            echo "requested_signing_mode=${{ inputs.signing_mode || 'auto' }}"
            echo "expected_signed=$LUMI_EXPECT_SIGNED"
            echo "expected_notarized=$LUMI_EXPECT_NOTARIZED"
            codesign -dv --verbose=4 "$app_path" 2>&1 | grep -E '^(Authority|TeamIdentifier|Signature|Identifier)=' || true
          } > macos-signing-report.txt

          if [[ "$LUMI_EXPECT_SIGNED" == "true" ]]; then
            codesign --verify --deep --strict --verbose=2 "$app_path"
            codesign -dv --verbose=4 "$app_path" 2>&1 | grep -q '^Authority=Developer ID Application:'
          fi
          if [[ "$LUMI_EXPECT_NOTARIZED" == "true" ]]; then
            xcrun stapler validate "$app_path"
            spctl --assess --type execute --verbose=2 "$app_path"
          fi

      - name: Upload macOS installer
        uses: actions/upload-artifact@v7
        with:
          name: lumi-os-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            macos-signing-report.txt
          if-no-files-found: error
          retention-days: 7
