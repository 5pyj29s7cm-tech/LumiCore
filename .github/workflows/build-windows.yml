name: Build Windows Installer

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-windows.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'server/**'
      - 'shared/**'
      - 'src/**'
      - 'src-tauri/**'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Artifact channel; public requires all signing and license gates'
        required: true
        default: internal
        type: choice
        options: [internal, public]
      include_local_voice:
        description: 'Bundle large offline voice resources'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']
      soak_run_id:
        description: 'Workflow run ID containing lumi-runtime-soak evidence (required for public)'
        required: false
        default: ''
        type: string

concurrency:
  group: lumi-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows ${{ inputs.channel || 'internal' }} candidate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Require a soak evidence run for public candidates
        if: inputs.channel == 'public' && inputs.soak_run_id == ''
        run: throw 'soak_run_id is required for a public candidate'

      - name: Quality and security gates
        run: |
          npm run lint
          npm test -- --run
          npm run security:audit

      - name: Prepare public signing inputs
        if: inputs.channel == 'public'
        shell: pwsh
        env:
          UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_PASSWORD }}
          COMMERCIAL_LICENSE_APPROVED: ${{ secrets.LUMI_COMMERCIAL_LICENSE_APPROVED }}
          DEPENDENCY_RISK_APPROVED: ${{ secrets.LUMI_DEPENDENCY_RISK_APPROVED }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATER_PUBLIC_KEY)) { throw 'TAURI_UPDATER_PUBLIC_KEY is required' }
          if ([string]::IsNullOrWhiteSpace($env:UPDATER_PRIVATE_KEY)) { throw 'TAURI_SIGNING_PRIVATE_KEY is required' }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) { throw 'WINDOWS_CODESIGN_CERTIFICATE_BASE64 is required' }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) { throw 'WINDOWS_CODESIGN_CERTIFICATE_PASSWORD is required' }
          if ($env:COMMERCIAL_LICENSE_APPROVED -ne '1') { throw 'LUMI_COMMERCIAL_LICENSE_APPROVED must be 1' }
          if ($env:DEPENDENCY_RISK_APPROVED -ne '1') { throw 'LUMI_DEPENDENCY_RISK_APPROVED must be 1' }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'lumi-windows-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate.Thumbprint) { throw 'Failed to import Windows signing certificate' }
          $publicConfigPath = Join-Path $env:RUNNER_TEMP 'lumi-public-tauri.conf.json'
          $publicConfig = @{
            bundle = @{ createUpdaterArtifacts = $true }
            plugins = @{ updater = @{ pubkey = $env:UPDATER_PUBLIC_KEY } }
          }
          $publicConfig | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $publicConfigPath -Encoding utf8
          "TAURI_BUNDLE_WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LUMI_RELEASE_TAURI_CONFIG=$publicConfigPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare desktop resources for Rust release check
        env:
          LUMI_RELEASE_CHANNEL: ${{ inputs.channel || 'internal' }}
          LUMI_DESKTOP_WITH_LOCAL_VOICE: ${{ inputs.include_local_voice == 'true' && '1' || '0' }}
        run: npm run build:desktop
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Rust release check
        working-directory: src-tauri
        run: cargo check --release --locked

      - name: Build Windows installer
        shell: pwsh
        env:
          LUMI_RELEASE_CHANNEL: ${{ inputs.channel || 'internal' }}
          LUMI_DESKTOP_WITH_LOCAL_VOICE: ${{ inputs.include_local_voice == 'true' && '1' || '0' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.channel == 'public' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.channel == 'public' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          if ($env:LUMI_RELEASE_CHANNEL -eq 'public') {
            if ([string]::IsNullOrWhiteSpace($env:LUMI_RELEASE_TAURI_CONFIG)) { throw 'Public Tauri override config is missing' }
            npx tauri build --config $env:LUMI_RELEASE_TAURI_CONFIG
          } else {
            npm run tauri:build
          }

      - name: Desktop preload budget
        run: npm run check:bundle-budget

      - name: Packaged backend smoke
        run: npm run smoke:packaged

      - name: 50-run lifecycle reliability and cold-start measurement
        env:
          LUMI_RELEASE_CHANNEL: ${{ inputs.channel || 'internal' }}
          LUMI_COLD_START_BASELINE_MS: ${{ inputs.channel == 'public' && vars.LUMI_COLD_START_BASELINE_MS || '' }}
        run: |
          if ($env:LUMI_RELEASE_CHANNEL -eq 'public' -and [string]::IsNullOrWhiteSpace($env:LUMI_COLD_START_BASELINE_MS)) {
            throw 'LUMI_COLD_START_BASELINE_MS repository variable is required for a public candidate'
          }
          npm run stress:lifecycle

      - name: Clean-user installer lifecycle smoke
        if: ${{ always() && !cancelled() && hashFiles('src-tauri/target/release/bundle/nsis/*.exe') != '' }}
        run: npm run smoke:installer:win

      - name: Generate checksums, manifest and release-out bundle
        run: |
          npm run release:manifest
          npm run release:bundle

      - name: Download current-commit 24-hour soak evidence
        if: inputs.channel == 'public'
        uses: actions/download-artifact@v7
        with:
          name: lumi-runtime-soak
          path: artifacts/runtime-reliability
          run-id: ${{ inputs.soak_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Strict public release gate
        if: inputs.channel == 'public'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          LUMI_COMMERCIAL_LICENSE_APPROVED: ${{ secrets.LUMI_COMMERCIAL_LICENSE_APPROVED }}
          LUMI_DEPENDENCY_RISK_APPROVED: ${{ secrets.LUMI_DEPENDENCY_RISK_APPROVED }}
        run: npm run release:check -- --strict-publish

      - name: Upload tested candidate (never creates a public Release)
        uses: actions/upload-artifact@v7
        with:
          name: lumi-os-windows-${{ inputs.channel || 'internal' }}-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/release-manifest.json
            release-out/**
          if-no-files-found: error
          retention-days: 7
