name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      include_local_voice:
        description: 'Bundle large offline voice resources'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build-windows:
    name: Build Windows NSIS
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Download Node.js binary
        run: node scripts/download-node-binary.mjs

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Windows installer
        env:
          LUMI_DESKTOP_WITH_LOCAL_VOICE: ${{ inputs.include_local_voice == 'true' && '1' || '0' }}
        run: npm run tauri:build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: lumi-os-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
