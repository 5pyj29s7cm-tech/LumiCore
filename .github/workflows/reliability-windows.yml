name: Windows 24-hour Reliability

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: lumi-windows-soak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  soak:
    name: 24-hour packaged runtime soak
    runs-on: [self-hosted, Windows, X64, lumi-reference]
    timeout-minutes: 1560
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build isolated internal runtime resources
        env:
          LUMI_RELEASE_CHANNEL: internal
        run: npm run build:desktop
      - run: npm run smoke:packaged
      - name: Attach provisioned offline voice runtime
        shell: pwsh
        env:
          GPTSOVITS_ROOT: ${{ vars.LUMI_GPTSOVITS_ROOT }}
          TTS_FIXTURE_ROOT: ${{ vars.LUMI_TTS_RELIABILITY_FIXTURE_DIR }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GPTSOVITS_ROOT)) { throw 'LUMI_GPTSOVITS_ROOT repository variable is required' }
          if ([string]::IsNullOrWhiteSpace($env:TTS_FIXTURE_ROOT)) { throw 'LUMI_TTS_RELIABILITY_FIXTURE_DIR repository variable is required' }
          $python = Join-Path $env:GPTSOVITS_ROOT 'venv\Scripts\python.exe'
          $api = Join-Path $env:GPTSOVITS_ROOT 'api_v2.py'
          $segments = Join-Path $env:TTS_FIXTURE_ROOT 'segments'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw "GPT-SoVITS Python is missing: $python" }
          if (-not (Test-Path -LiteralPath $api -PathType Leaf)) { throw "GPT-SoVITS API is missing: $api" }
          if (-not (Test-Path -LiteralPath $segments -PathType Container)) { throw "Voice fixture segments are missing: $segments" }
          $linkPath = Join-Path $env:GITHUB_WORKSPACE 'desktop-resources\gpt-sovits-src'
          $expectedLinkPath = [IO.Path]::GetFullPath($linkPath)
          $workspaceRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          if (-not $expectedLinkPath.StartsWith($workspaceRoot, [StringComparison]::OrdinalIgnoreCase)) { throw 'Voice runtime link escaped the workspace' }
          $existing = Get-Item -LiteralPath $expectedLinkPath -Force
          if ($existing.Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Voice runtime link path is already a reparse point' }
          [IO.Directory]::Delete($expectedLinkPath, $true)
          New-Item -ItemType Junction -Path $expectedLinkPath -Target ([IO.Path]::GetFullPath($env:GPTSOVITS_ROOT)) | Out-Null
      - name: Run 24-hour health, MCP, database and exception soak
        env:
          LUMI_TTS_RELIABILITY_FIXTURE_DIR: ${{ vars.LUMI_TTS_RELIABILITY_FIXTURE_DIR }}
        run: npm run soak:runtime -- --duration-hours 24 --min-mixed-rounds 200
      - uses: actions/upload-artifact@v7
        with:
          name: lumi-runtime-soak
          path: artifacts/runtime-reliability/soak.json
          if-no-files-found: error
          retention-days: 30
