name: LumiOS CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lumi-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tests, frontends, audit and budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint and type-check
        run: npm run lint
      - name: Run complete Vitest suite
        run: npm test -- --reporter=json --outputFile=vitest-results.json
      - name: Enforce test inventory
        run: npm run test:inventory -- vitest-results.json
      - name: Build desktop and mobile frontends
        run: npm run build:frontends
      - name: Enforce desktop initial-load budget
        env:
          LUMI_DESKTOP_DIST: dist
        run: npm run check:bundle-budget
      - name: Enforce tool capability metadata
        run: npm run docs:capability-stats
      - name: Audit production dependencies
        run: npm run security:audit

  rust-check:
    name: Rust release check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:desktop-ui
      - name: Create checked resource placeholders
        run: |
          mkdir -p desktop-resources/dist-server desktop-resources/gpt-sovits-src desktop-resources/data/voice_training
          touch desktop-resources/dist-server/.gitkeep desktop-resources/gpt-sovits-src/.gitkeep desktop-resources/data/voice_training/.gitkeep desktop-resources/WebView2Loader.dll
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libayatana-appindicator3-dev libdbus-1-dev libxdo-dev libxtst-dev
      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Cargo release check
        working-directory: src-tauri
        run: cargo check --release --locked

  internal-diagnostic:
    name: Internal diagnostic package
    if: github.event_name != 'pull_request'
    needs: [quality, rust-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build internal diagnostic resources
        env:
          LUMI_RELEASE_CHANNEL: internal
        run: npm run build:desktop
      - uses: actions/upload-artifact@v7
        with:
          name: lumi-os-internal-diagnostic-${{ github.sha }}
          path: |
            dist/desktop/**
            desktop-resources/dist-server/**
          if-no-files-found: error
          retention-days: 7
