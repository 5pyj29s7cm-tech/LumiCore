name: LumiCore CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lumi-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: ${{ github.repository == '5pyj29s7cm-tech/LumiCore' }}
    name: Lint, tests, frontends, audit and budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint and type-check
        run: npm run lint
      - name: Run complete Vitest suite
        # Several security suites create isolated Git repositories and worktrees.
        # Bound concurrency without serializing the entire 3,700+ test inventory.
        run: npm test -- --maxWorkers=2 --reporter=json --outputFile=vitest-results.json
      - name: Enforce test inventory
        if: always()
        run: npm run test:inventory -- vitest-results.json
      - name: Build desktop and mobile frontends
        run: npm run build:frontends
      - name: Enforce desktop initial-load budget
        env:
          LUMI_DESKTOP_DIST: dist
        run: npm run check:bundle-budget
      - name: Enforce tool capability metadata
        run: npm run docs:capability-stats
      - name: Audit production dependencies
        run: npm run security:audit

  rust-check:
    if: ${{ github.repository == '5pyj29s7cm-tech/LumiCore' }}
    name: Rust release check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:desktop-ui
      - name: Create checked resource placeholders
        run: |
          mkdir -p desktop-resources/dist-server desktop-resources/gpt-sovits-src desktop-resources/data/voice_training
          touch desktop-resources/dist-server/.gitkeep desktop-resources/gpt-sovits-src/.gitkeep desktop-resources/data/voice_training/.gitkeep desktop-resources/WebView2Loader.dll
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libayatana-appindicator3-dev libdbus-1-dev libxdo-dev libxtst-dev
      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Cargo release check
        working-directory: src-tauri
        run: cargo check --release --locked
