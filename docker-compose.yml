# LumiOS unified deployment
#
# Personal and organization work domains run in the same service:
#   docker compose up -d
#   http://localhost:3000

services:
  lumi:
    build: .
    container_name: lumi
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      LUMI_DATA_DIR: /app
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    volumes:
      # Keep the existing volume key so upgrades retain local data.
      - lumi_personal_data:/app/data
    restart: unless-stopped

volumes:
  lumi_personal_data:
